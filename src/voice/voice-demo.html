<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeporteV Voice Data Bot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0c;
        --panel: #111718;
        --line: #263232;
        --green: #11a85b;
        --text: #f4f7f6;
        --muted: #91a09c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 50% 0%, #17201e 0, var(--bg) 42rem);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(860px, 100%);
        display: grid;
        gap: 18px;
      }

      header {
        display: grid;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 54px);
        line-height: 0.95;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .panel {
        background: color-mix(in srgb, var(--panel), transparent 4%);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
      }

      input {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #080c0c;
        color: var(--text);
        font: inherit;
        padding: 14px 14px;
        outline: none;
      }

      input:focus {
        border-color: var(--green);
      }

      button {
        border: 1px solid color-mix(in srgb, var(--green), white 20%);
        border-radius: 6px;
        background: var(--green);
        color: white;
        font: inherit;
        font-weight: 700;
        padding: 0 16px;
        min-height: 50px;
        cursor: pointer;
      }

      button.secondary {
        background: #0c1111;
        color: var(--text);
        border-color: var(--line);
      }

      button.listening {
        background: #16804d;
        border-color: color-mix(in srgb, var(--green), white 42%);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--green), transparent 72%);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .answer {
        min-height: 120px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #070909;
        padding: 18px;
        display: grid;
        align-content: start;
        gap: 8px;
      }

      .answer strong {
        color: var(--green);
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .answer div {
        font-size: clamp(20px, 3vw, 32px);
        line-height: 1.15;
      }

      .answer small {
        color: var(--muted);
        line-height: 1.45;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chips button {
        min-height: 36px;
        padding: 0 10px;
        font-size: 13px;
      }

      @media (max-width: 680px) {
        .controls {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Voice Data Bot</h1>
        <p>Pregunta con voz o texto. Gemini razona con la data del torneo y también genera la voz de respuesta.</p>
      </header>

      <section class="panel">
        <div class="controls">
          <input id="question" value="¿Quién es el portero con más atajadas hasta ahora?" />
          <button id="ask">Preguntar</button>
          <button id="mic" class="secondary">Mantén micrófono</button>
        </div>

        <div class="chips">
          <button class="secondary" data-question="¿Quién es el portero con más atajadas?">Portero con más atajadas</button>
          <button class="secondary" data-question="Dame el once ideal de la fase de grupos">XI ideal</button>
          <button class="secondary" data-question="¿Quién tiene el mejor rating hasta ahora?">Mejor rating</button>
          <button class="secondary" data-question="¿Quién va a ganar el Mundial?">Favoritos Mundial</button>
          <button class="secondary" data-question="Predicción Brasil Japón">Predicción</button>
          <button class="secondary" data-question="Odds Alemania Paraguay">Odds</button>
          <button class="secondary" data-question="Estadísticas México Sudáfrica xG remates posesión">Stats partido</button>
          <button class="secondary" data-question="Incidencias México Sudáfrica tarjetas goles">Incidencias</button>
        </div>

        <div class="answer">
          <strong id="intent">Listo</strong>
          <div id="answer">Haz una pregunta para escuchar la respuesta.</div>
          <small id="meta">Modo: Gemini + data + voz Gemini cuando la llave este activa.</small>
        </div>
      </section>
    </main>

    <script>
      const questionInput = document.querySelector("#question");
      const answerEl = document.querySelector("#answer");
      const intentEl = document.querySelector("#intent");
      const metaEl = document.querySelector("#meta");
      const askButton = document.querySelector("#ask");
      const micButton = document.querySelector("#mic");
      let audioContext = null;
      let currentAudio = null;
      let currentAudioUrl = "";
      let currentSource = null;
      let recognition = null;
      let micHeld = false;
      let micStopping = false;
      let micSubmitted = false;
      let finalTranscript = "";
      let interimTranscript = "";

      async function ask(question) {
        const q = String(question || questionInput.value || "").trim();
        if (!q) return;

        askButton.disabled = true;
        answerEl.textContent = "Gemini esta razonando con la data...";
        intentEl.textContent = "Procesando";
        metaEl.textContent = "Modo: consultando Gemini.";
        unlockAudio();

        try {
          const response = await fetch(`/api/voice/query?q=${encodeURIComponent(q)}`);
          const payload = await response.json();
          const baseMeta = buildMeta(payload);
          answerEl.textContent = payload.answer || "No encontre respuesta.";
          intentEl.textContent = payload.intent || "Respuesta";
          metaEl.textContent = `${baseMeta} Audio: generando voz Gemini.`;
          await speak(payload.answer || "", baseMeta);
        } catch (error) {
          answerEl.textContent = `No pude consultar el bot: ${error.message}`;
          intentEl.textContent = "Error";
          metaEl.textContent = "Modo: error de consulta.";
        } finally {
          askButton.disabled = false;
        }
      }

      function buildMeta(payload) {
        const ai = payload.ai || {};
        if (ai.used) {
          const model = ai.model ? ` (${ai.model})` : "";
          const criteria = payload.reasoning_summary ? ` Criterio: ${payload.reasoning_summary}` : "";
          return `Modo: Gemini + data${model}.${criteria}`;
        }

        const reason = ai.reason || ai.error || "sin detalle";
        return `Modo: respaldo local. Gemini no respondio: ${reason}.`;
      }

      async function speak(text, baseMeta) {
        if (!text) return;

        stopAudio();

        try {
          const response = await fetch("/api/voice/speak", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ text }),
          });

          if (!response.ok) {
            let detail = response.statusText;
            try {
              const payload = await response.json();
              detail = payload.error || detail;
            } catch (error) {
              detail = await response.text();
            }
            throw new Error(detail || `HTTP ${response.status}`);
          }

          const blob = await response.blob();
          await playGeneratedAudio(blob);
          metaEl.textContent = `${baseMeta} Audio: Gemini TTS.`;
        } catch (error) {
          metaEl.textContent = `${baseMeta} Audio: voz del navegador como respaldo (${error.message}).`;
          fallbackSpeak(text);
        }
      }

      function unlockAudio() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;

        try {
          if (!audioContext) audioContext = new Context();
          if (audioContext.state === "suspended") audioContext.resume();
          const buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start(0);
        } catch (error) {
          // The regular audio element fallback will handle unsupported browsers.
        }
      }

      async function playGeneratedAudio(blob) {
        if (audioContext) {
          if (audioContext.state === "suspended") await audioContext.resume();
          const audioBuffer = await audioContext.decodeAudioData(await blob.arrayBuffer());
          currentSource = audioContext.createBufferSource();
          currentSource.buffer = audioBuffer;
          currentSource.connect(audioContext.destination);
          currentSource.onended = () => {
            currentSource = null;
          };
          currentSource.start(0);
          return;
        }

        currentAudioUrl = URL.createObjectURL(blob);
        currentAudio = new Audio(currentAudioUrl);
        currentAudio.onended = stopAudio;
        currentAudio.onerror = () => {
          throw new Error("Gemini TTS no pudo reproducirse.");
        };
        await currentAudio.play();
      }

      function stopAudio() {
        if (currentSource) {
          try {
            currentSource.stop();
          } catch (error) {
            // Already stopped.
          }
          currentSource = null;
        }
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        if (currentAudioUrl) {
          URL.revokeObjectURL(currentAudioUrl);
          currentAudioUrl = "";
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      }

      function fallbackSpeak(text) {
        if (!text || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "es-MX";
        utterance.rate = 1.04;
        utterance.pitch = 0.95;
        window.speechSynthesis.speak(utterance);
      }

      function startMicHold(event) {
        event?.preventDefault();
        if (micHeld) return;

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
          answerEl.textContent = "Este navegador no tiene reconocimiento de voz integrado. Puedes escribir la pregunta.";
          intentEl.textContent = "Micrófono no disponible";
          return;
        }

        stopAudio();
        unlockAudio();
        micHeld = true;
        micStopping = false;
        micSubmitted = false;
        finalTranscript = "";
        interimTranscript = "";
        questionInput.value = "";
        intentEl.textContent = "Escuchando";
        answerEl.textContent = "Mantén presionado y habla. Al soltar, mando la pregunta.";
        metaEl.textContent = "Micrófono activo: suelta el botón para enviar.";
        micButton.classList.add("listening");
        micButton.textContent = "Escuchando...";

        try {
          micButton.setPointerCapture?.(event.pointerId);
        } catch (error) {
          // Some browsers do not support pointer capture on this element.
        }

        recognition = new Recognition();
        recognition.lang = "es-MX";
        recognition.interimResults = true;
        recognition.continuous = true;
        recognition.maxAlternatives = 1;
        recognition.onresult = (event) => {
          interimTranscript = "";
          for (let index = event.resultIndex; index < event.results.length; index += 1) {
            const result = event.results[index];
            const transcript = result?.[0]?.transcript || "";
            if (result?.isFinal) {
              finalTranscript = `${finalTranscript} ${transcript}`.trim();
            } else {
              interimTranscript = `${interimTranscript} ${transcript}`.trim();
            }
          }

          const currentText = getMicTranscript();
          if (currentText) questionInput.value = currentText;
        };
        recognition.onerror = (errorEvent) => {
          const errorName = errorEvent?.error || "error";
          if (errorName === "aborted" && micStopping) return;
          answerEl.textContent =
            errorName === "not-allowed"
              ? "El navegador no tiene permiso para usar el micrófono."
              : "No pude escuchar bien. Mantén presionado el botón y vuelve a intentar.";
          intentEl.textContent = "Micrófono";
          metaEl.textContent = `Micrófono: ${errorName}.`;
        };
        recognition.onend = () => {
          if (micHeld && !micStopping) {
            restartRecognition();
            return;
          }

          finishMicHold();
        };
        startRecognition();
      }

      function stopMicHold(event) {
        event?.preventDefault();
        if (!micHeld) return;

        micHeld = false;
        micStopping = true;
        try {
          micButton.releasePointerCapture?.(event.pointerId);
        } catch (error) {
          // Pointer capture may already be released.
        }

        if (recognition) {
          try {
            recognition.stop();
            return;
          } catch (error) {
            finishMicHold();
            return;
          }
        }

        finishMicHold();
      }

      function startRecognition() {
        try {
          recognition.start();
        } catch (error) {
          finishMicHold();
          answerEl.textContent = "No pude activar el micrófono. Intenta otra vez.";
          intentEl.textContent = "Micrófono";
          metaEl.textContent = `Micrófono: ${error.message}.`;
        }
      }

      function restartRecognition() {
        window.setTimeout(() => {
          if (!micHeld || !recognition) return;
          try {
            recognition.start();
          } catch (error) {
            // Chrome can throw if recognition is still settling; the user can release and retry.
          }
        }, 120);
      }

      function finishMicHold() {
        const transcript = getMicTranscript();
        recognition = null;
        micHeld = false;
        micStopping = false;
        micButton.classList.remove("listening");
        micButton.textContent = "Mantén micrófono";

        if (micSubmitted) return;
        micSubmitted = true;

        if (!transcript) {
          answerEl.textContent = "No detecté voz. Mantén presionado el botón mientras hablas.";
          intentEl.textContent = "Micrófono";
          metaEl.textContent = "Micrófono listo.";
          return;
        }

        questionInput.value = transcript;
        ask(transcript);
      }

      function getMicTranscript() {
        return `${finalTranscript} ${interimTranscript}`.replace(/\s+/g, " ").trim();
      }

      askButton.addEventListener("click", () => ask());
      micButton.addEventListener("pointerdown", startMicHold);
      micButton.addEventListener("pointerup", stopMicHold);
      micButton.addEventListener("pointercancel", stopMicHold);
      micButton.addEventListener("lostpointercapture", () => {
        if (micHeld) stopMicHold();
      });
      micButton.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") startMicHold(event);
      });
      micButton.addEventListener("keyup", (event) => {
        if (event.code === "Space" || event.code === "Enter") stopMicHold(event);
      });
      questionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") ask();
      });
      document.querySelectorAll("[data-question]").forEach((button) => {
        button.addEventListener("click", () => {
          questionInput.value = button.dataset.question;
          ask(button.dataset.question);
        });
      });
    </script>
  </body>
</html>
